#cd name: CI - Testes e Docker

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Executar testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Executar testes
        run: npm test

